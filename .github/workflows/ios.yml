name: iOS
on:
  pull_request:
    branches: [main]
    paths: ['native/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift-ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift core
        working-directory: native
        run: swift test
      - name: Install XcodeGen if needed
        run: command -v xcodegen || brew install xcodegen
      - name: Generate Xcode project and app icon
        working-directory: native
        run: |
          swift Scripts/generate-icon.swift
          xcodegen generate
      - name: Build iOS app without signing
        working-directory: native
        run: >-
          xcodebuild -project TravelMap.xcodeproj -scheme TravelMap
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build-output/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Test device storage and native UI
        working-directory: native
        run: |
          simulator_id=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$simulator_id" && test "$simulator_id" != null
          xcodebuild -project TravelMap.xcodeproj -scheme TravelMap \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -destination-timeout 120 -parallel-testing-enabled NO \
            -derivedDataPath .build-output/DerivedData \
            -resultBundlePath .build-output/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: native/.build-output/UITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
